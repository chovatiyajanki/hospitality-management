<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#052e2b" />
    <title>You're offline · Gurukrupa Clinic</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3faf7;color:#062824;font:16px/1.5 Inter,system-ui,sans-serif}.card{width:min(100%,480px);padding:36px;border:1px solid #cfe3dc;border-radius:24px;background:white;box-shadow:0 18px 50px -24px #052e2b44;text-align:center}.mark{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 18px;border-radius:18px;background:linear-gradient(135deg,#10b981,#0d9488);color:#fff;font-size:30px;font-weight:700}.mark:before{content:'+'}h1{margin:0 0 8px;font-size:25px;letter-spacing:-.04em}p{margin:0;color:#5a716c}button{margin-top:24px;min-height:46px;padding:0 20px;border:0;border-radius:14px;background:#059669;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body><main class="card"><div class="mark" aria-hidden="true"></div><h1>You're offline</h1><p>Reconnect to the internet to view the live queue or book an appointment.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
